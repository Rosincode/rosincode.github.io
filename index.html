<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ME4L</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  
  <style>
    :root{
      --bg:#0f1115;
      --card:#161a22;
      --border:#2a3140;
      --text:#e6e8ee;
      --muted:#9aa3b2;
      --btn:#2b78ff;
      --btn2:#1f5fd0;
      --r:12px;
      --h:44px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:12px 12px calc(78px + env(safe-area-inset-bottom));
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:2px 2px 10px;
    }
    header h1{ margin:0; font-size:16px; font-weight:800; letter-spacing:.2px; }
    header .pill{
      font-size:11px;
      color:var(--muted);
      background:rgba(255,255,255,.06);
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      white-space:nowrap;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:10px;
      margin-bottom: 10px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .field{
      position:relative;
    }

    .field input,
    .field select{
      width:100%;
      height:var(--h);
      padding: 18px 12px 5px;
      border-radius:var(--r);
      border:1px solid var(--border);
      background:#0f131c;
      color:var(--text);
      font-size:15px;
      outline:none;
    }

    .field select{
      appearance:none;
      -webkit-appearance:none;
      padding-right:34px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 19px,
        calc(100% - 12px) 19px;
      background-size:6px 6px, 6px 6px;
      background-repeat:no-repeat;
    }

    .field label{
      position:absolute;
      left:12px;
      top:14px;
      font-size:12px;
      color:var(--muted);
      pointer-events:none;
      transition:all .12s ease;
    }

    .field input:focus + label,
    .field select:focus + label,
    .field.filled label{
      top:6px;
      font-size:10.5px;
      opacity:.95;
    }

    .hint{
      margin:0 2px 5px;
      font-size:11px;
      color:var(--muted);
      line-height:1.35;
    }

    .sticky{
      position:fixed;
      left:0; right:0; bottom:0;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(to top, rgba(15,17,21,.98), rgba(15,17,21,.70), rgba(15,17,21,0));
      backdrop-filter:blur(8px);
    }

    button{
      width:100%;
      height:48px;
      border:none;
      border-radius:14px;
      background:var(--btn);
      color:#fff;
      font-size:15px;
      font-weight:800;
      letter-spacing:.2px;
    }
    button:active{ background:var(--btn2); }
    button:disabled{ opacity:.5; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>

<body>
  <header>
    <h1>ME4L</h1>
    <div class="pill" id="pinfo">—</div>
  </header>

  <div class="panel">
    <div class="hint">
        Hoeveelheid
    </div>
    
    <div class="group">

      <div class="field">
        <input id="adults" type="number" value="2" min="0" inputmode="numeric">
        <label for="adults">Aantal volwassenen</label>
      </div>

      <div class="field">
        <input id="kids" type="number" value="2" min="0" inputmode="numeric">
        <label for="kids">Aantal kids</label>
      </div>

      <div class="field">
        <input id="kid_factor" type="number" step="0.1" value="0.6" min="0.5" max="1" inputmode="decimal">
        <label for="kid_factor">Kids factor</label>
      </div>

      <div class="field">
        <input id="days" type="number" value="2" min="1" inputmode="numeric">
        <label for="days">Aantal dagen</label>
      </div>

    </div>
  </div>
  <div class="panel">
    <div class="hint">
        Maaltijd
    </div>
    
    <div class="group">
      
      <div class="field">
        <select id="base"></select>
        <label for="base">Basis</label>
      </div>

      <div class="field">
        <select id="protein"></select>
        <label for="protein">Eiwit</label>
      </div>

      <div class="field">
        <select id="veg"></select>
        <label for="veg">Groente</label>
      </div>

      <div class="field">
        <select id="flavor"></select>
        <label for="flavor">Smaakmaker</label>
      </div>

    </div>
  </div>

  <div class="sticky">
    <button id="make_note_btn" onclick="share_list()" disabled>Opslaan</button>
  </div>

  <script>
    let options, packaging, per;

    async function load_options() {
      const res = await fetch("./options.json", { cache: "no-store" });
      if (!res.ok) throw new Error("options.json niet gevonden");
      const data = await res.json();
      options = data.options;
      packaging = data.packaging;
      per = data.per_portion;
    }

    function fill(id, list, def) {
      const s = document.getElementById(id);
      s.innerHTML = "";
      for (const o of list) {
        const opt = document.createElement("option");
        opt.value = o.id;
        opt.textContent = o.name;
        s.appendChild(opt);
      }
      s.value = def || list[0]?.id;
      mark_filled(s);
    }

    function portions() {
      const a = +adults.value || 0;
      const k = +kids.value || 0;
      const f = +kid_factor.value || 0.6;
      const d = +days.value || 1;
      return (a + k * f) * d;
    }

    function round(v, step) {
      const s = step || 1;
      return Math.ceil(v / s) * s;
    }

    function base_round_step(base) {
      if (base.round_step_key && packaging[base.round_step_key]) return packaging[base.round_step_key];
      if (base.id === "pasta" && packaging.pasta_step_g) return packaging.pasta_step_g;
      return packaging.rice_step_g || 50;
    }

    function update_portion_info() {
      const p = portions();
      pinfo.textContent = `≈ ${p.toFixed(1)} porties`;
    }

    function build_list_text() {
      const p = portions();
      const out = [];

      const veg = options.veg.find(x => x.id === veg_select.value);
      const veg_step = packaging.veg_fresh_pack_g || 400;
      const veg_g = round(per.veg_g * p, veg_step);
      out.push(`- ${veg.name} – ${veg_g} g`);

      const prot = options.protein.find(x => x.id === protein_select.value);
      const prot_step = packaging.protein_step_g || 100;
      const prot_g = round(per.protein_g * p, prot_step);
      out.push(`- ${prot.name} – ${prot_g} g`);

     const base = options.base.find(x => x.id === base_select.value);
      if (base.type === "wraps_count") {
        out.push(`- ${base.name} – ${Math.ceil(per.wraps_count * p)} st`);
      } else if (base.type === "potato_g") {
        const potato_step = packaging.potato_step_g || 250;
        out.push(`- ${base.name} – ${round(per.potato_g * p, potato_step)} g`);
      } else {
        out.push(`- ${base.name} – ${round(per.base_dry_g * p, base_round_step(base))} g`);
      }

      const flav = options.flavor.find(x => x.id === flavor_select.value);
      out.push(`- ${flav.name}`);

      return out.join("\n");
    }

    async function share_list() {
      const text = build_list_text();

      try { await navigator.clipboard.writeText(text); } catch (e) {}

      if (navigator.share) {
        try { await navigator.share({ title: "Boodschappenlijst", text }); return; }
        catch (e) {}
      }

      alert("Gekopieerd. Plak in Notities.");
    }

    function mark_filled(el) {
      const field = el.closest(".field");
      if (!field) return;
      const filled = (el.value != null && String(el.value).trim() !== "");
      field.classList.toggle("filled", filled);
    }

    // elements
    const adults = document.getElementById("adults");
    const kids = document.getElementById("kids");
    const kid_factor = document.getElementById("kid_factor");
    const days = document.getElementById("days");

    const base_select = document.getElementById("base");
    const protein_select = document.getElementById("protein");
    const veg_select = document.getElementById("veg");
    const flavor_select = document.getElementById("flavor");

    const make_note_btn = document.getElementById("make_note_btn");
    const pinfo = document.getElementById("pinfo");

    // float labels on input/change
    const all_fields = [adults, kids, kid_factor, days, base_select, protein_select, veg_select, flavor_select];
    for (const el of all_fields) {
      el.addEventListener("input", () => { mark_filled(el); update_portion_info(); });
      el.addEventListener("change", () => { mark_filled(el); update_portion_info(); });
      mark_filled(el);
    }

    load_options().then(() => {
      fill("base", options.base, "rice_white");
      fill("protein", options.protein, "chicken");
      fill("veg", options.veg, "stirfry_mix");
      fill("flavor", options.flavor, "curry_yellow");
      make_note_btn.disabled = false;
      update_portion_info();
    }).catch(err => alert(err.message));
  </script>
</body>
</html>
