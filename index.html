<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Meal Matrix</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --border: #d1d1d6;
      --muted: #6b7280;
      --btn: #007aff;
      --btn2: #005ecb;
      --r: 12px;
      --gap: 8px;
      --pad: 10px;
      --fs: 14px;
      --fs2: 12px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 10px 10px calc(76px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 10px;
    }
    header h1 { font-size: 16px; margin: 0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      font-size: var(--fs2);
      font-weight: 700;
      margin: 0 0 4px;
      color: #111827;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--card);
      font-size: var(--fs);
      line-height: 1.2;
      height: 38px;
    }
    select { padding-right: 28px; }
    .sticky {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(242,242,247,0.98), rgba(242,242,247,0.70), rgba(242,242,247,0));
      backdrop-filter: blur(8px);
    }
    button {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      background: var(--btn);
      color: #fff;
    }
    button:active { background: var(--btn2); }
    button:disabled { opacity: .55; }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin: 6px 2px 0;
    }
    .tiny {
      font-size: 11px;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>🍽️ Meal Matrix</h1>
    <p class="tiny" id="pinfo">—</p>
  </header>

  <div class="grid">
    <div>
      <label>Volw.</label>
      <input id="adults" type="number" value="2" min="0">
    </div>
    <div>
      <label>Kids</label>
      <input id="kids" type="number" value="2" min="0">
    </div>

    <div>
      <label>Kids factor</label>
      <input id="kid_factor" type="number" step="0.1" value="0.6" min="0.5" max="1">
    </div>
    <div>
      <label>Dagen</label>
      <input id="days" type="number" value="2" min="1">
    </div>

    <div class="full">
      <label>Basis</label>
      <select id="base"></select>
    </div>

    <div class="full">
      <label>Eiwit</label>
      <select id="protein"></select>
    </div>

    <div class="full">
      <label>Groente</label>
      <select id="veg"></select>
    </div>

    <div class="full">
      <label>Smaakmaker</label>
      <select id="flavor"></select>
    </div>

    <div class="full">
      <label>Vet (optioneel)</label>
      <select id="fat"></select>
      <div class="hint">Knop kopieert + opent Delen → kies Notities voor checkboxen.</div>
    </div>
  </div>

  <div class="sticky">
    <button id="make_note_btn" onclick="share_list()" disabled>📝 Maak notitie</button>
  </div>

  <script>
    let options, packaging, per;

    async function load_options() {
      const res = await fetch("./options.json", { cache: "no-store" });
      if (!res.ok) throw new Error("options.json niet gevonden");
      const data = await res.json();
      options = data.options;
      packaging = data.packaging;
      per = data.per_portion;
    }

    function fill(id, list, def) {
      const s = document.getElementById(id);
      s.innerHTML = "";
      for (const o of list) {
        const opt = document.createElement("option");
        opt.value = o.id;
        opt.textContent = o.name;
        s.appendChild(opt);
      }
      s.value = def || list[0]?.id;
    }

    function portions() {
      const a = +adults.value || 0;
      const k = +kids.value || 0;
      const f = +kid_factor.value || 0.6;
      const d = +days.value || 1;
      return (a + k * f) * d;
    }

    function round(v, step) {
      const s = step || 1;
      return Math.ceil(v / s) * s;
    }

    function base_round_step(base) {
      if (base.round_step_key && packaging[base.round_step_key]) return packaging[base.round_step_key];
      if (base.id === "pasta" && packaging.pasta_step_g) return packaging.pasta_step_g;
      return packaging.rice_step_g || 50;
    }

    function update_portion_info() {
      const p = portions();
      pinfo.textContent = `≈ ${p.toFixed(1)} porties`;
    }

    function build_list_text() {
      const p = portions();
      const out = [];

      // Vet -> Groenten -> Eiwitten -> Basis -> Smaakmaker
      const fat = options.fat.find(x => x.id === fat_select.value);
      if (fat && fat.id !== "none") out.push(`☐ ${fat.name}`);

      const veg = options.veg.find(x => x.id === veg_select.value);
      const veg_step = packaging.veg_fresh_pack_g || 400;
      const veg_g = round(per.veg_g * p, veg_step);
      out.push(`☐ ${veg.name} – ${veg_g} g`);

      const prot = options.protein.find(x => x.id === protein_select.value);
      const prot_step = packaging.protein_step_g || 100;
      const prot_g = round(per.protein_g * p, prot_step);
      out.push(`☐ ${prot.name} – ${prot_g} g`);

      const base = options.base.find(x => x.id === base_select.value);
      if (base.type === "wraps_count") {
        out.push(`☐ ${base.name} – ${Math.ceil(per.wraps_count * p)} st`);
      } else if (base.type === "potato_g") {
        const potato_step = packaging.potato_step_g || 250;
        out.push(`☐ ${base.name} – ${round(per.potato_g * p, potato_step)} g`);
      } else {
        out.push(`☐ ${base.name} – ${round(per.base_dry_g * p, base_round_step(base))} g`);
      }

      const flav = options.flavor.find(x => x.id === flavor_select.value);
      out.push(`☐ ${flav.name}`);

      return out.join("\n");
    }

    async function share_list() {
      const text = build_list_text();

      try { await navigator.clipboard.writeText(text); } catch (e) {}

      if (navigator.share) {
        try { await navigator.share({ title: "Boodschappenlijst", text }); return; }
        catch (e) {}
      }

      alert("Gekopieerd. Plak in Notities.");
    }

    // elements
    const adults = document.getElementById("adults");
    const kids = document.getElementById("kids");
    const kid_factor = document.getElementById("kid_factor");
    const days = document.getElementById("days");

    const base_select = document.getElementById("base");
    const protein_select = document.getElementById("protein");
    const veg_select = document.getElementById("veg");
    const flavor_select = document.getElementById("flavor");
    const fat_select = document.getElementById("fat");

    const make_note_btn = document.getElementById("make_note_btn");
    const pinfo = document.getElementById("pinfo");

    // update portion label on input
    [adults, kids, kid_factor, days].forEach(el => {
      el.addEventListener("input", update_portion_info);
      el.addEventListener("change", update_portion_info);
    });

    load_options().then(() => {
      fill("base", options.base, "rice_white");
      fill("protein", options.protein, "chicken");
      fill("veg", options.veg, "stirfry_mix");
      fill("flavor", options.flavor, "curry_yellow");
      fill("fat", options.fat, "none");
      make_note_btn.disabled = false;
      update_portion_info();
    }).catch(err => alert(err.message));
  </script>
</body>
</html>
