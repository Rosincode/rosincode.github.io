<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Meal Matrix</title>

  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #f2f2f7;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 12px;
      border: 1px solid #d1d1d6;
      font-size: 16px;
      background: #fff;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      background: #007aff;
      color: #fff;
    }
    button:active {
      background: #005ecb;
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <h1>🍽️ Meal Matrix</h1>

  <label>Aantal volwassenen</label>
  <input id="adults" type="number" value="2" min="0">

  <label>Aantal kids</label>
  <input id="kids" type="number" value="2" min="0">

  <label>Kids factor</label>
  <input id="kid_factor" type="number" step="0.1" value="0.6" min="0.5" max="1">

  <label>Aantal dagen</label>
  <input id="days" type="number" value="2" min="1">

  <label>Basis</label>
  <select id="base"></select>

  <label>Eiwit</label>
  <select id="protein"></select>

  <label>Groente</label>
  <select id="veg"></select>

  <label>Smaakmaker</label>
  <select id="flavor"></select>

  <label>Vet (optioneel)</label>
  <select id="fat"></select>

  <button onclick="make_list()">🛒 Boodschappenlijst</button>

  <script>
    let options, packaging, per;

    async function load_options() {
      const res = await fetch("./options.json", { cache: "no-store" });
      const data = await res.json();
      options = data.options;
      packaging = data.packaging;
      per = data.per_portion;
    }

    function fill(id, list, def) {
      const s = document.getElementById(id);
      s.innerHTML = "";
      for (const o of list) {
        const opt = document.createElement("option");
        opt.value = o.id;
        opt.textContent = o.name;
        s.appendChild(opt);
      }
      s.value = def || list[0]?.id;
    }

    function portions() {
      const a = +adults.value;
      const k = +kids.value;
      const f = +kid_factor.value;
      const d = +days.value;
      return (a + k * f) * d;
    }

    function round(v, step) {
      return Math.ceil(v / step) * step;
    }

    function make_list() {
      const p = portions();
      const out = [];

      const fat = options.fat.find(x => x.id === fat_select.value);
      if (fat && fat.id !== "none") out.push(`☐ ${fat.name}`);

      const veg = options.veg.find(x => x.id === veg_select.value);
      const veg_g = round(per.veg_g * p, packaging.veg_fresh_pack_g);
      out.push(`☐ ${veg.name} – ${veg_g} g`);

      const prot = options.protein.find(x => x.id === protein_select.value);
      const prot_g = round(per.protein_g * p, packaging.protein_step_g);
      out.push(`☐ ${prot.name} – ${prot_g} g`);

      const base = options.base.find(x => x.id === base_select.value);
      if (base.type === "wraps_count") {
        out.push(`☐ ${base.name} – ${Math.ceil(per.wraps_count * p)} st`);
      } else if (base.type === "potato_g") {
        out.push(`☐ ${base.name} – ${round(per.potato_g * p, packaging.potato_step_g)} g`);
      } else {
        out.push(`☐ ${base.name} – ${round(per.base_dry_g * p, packaging.rice_step_g)} g`);
      }

      const flav = options.flavor.find(x => x.id === flavor_select.value);
      out.push(`☐ ${flav.name}`);

      navigator.clipboard.writeText(out.join("\n"));
      alert("Boodschappenlijst gekopieerd naar klembord");
    }

    const adults = document.getElementById("adults");
    const kids = document.getElementById("kids");
    const kid_factor = document.getElementById("kid_factor");
    const days = document.getElementById("days");

    const base_select = document.getElementById("base");
    const protein_select = document.getElementById("protein");
    const veg_select = document.getElementById("veg");
    const flavor_select = document.getElementById("flavor");
    const fat_select = document.getElementById("fat");

    load_options().then(() => {
      fill("base", options.base);
      fill("protein", options.protein);
      fill("veg", options.veg);
      fill("flavor", options.flavor);
      fill("fat", options.fat, "none");
    });
  </script>
</body>
</html>
